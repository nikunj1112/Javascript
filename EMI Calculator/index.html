<!DOCTYPE html>
<html>

<head>
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <h2>EMI Calculator</h2>

    <div class="container">


        <div class="left">

            <label>Loan Amount</label>
            <input type="range" id="loan" min="20000" max="5000000" value="1000000" step="10000">
            <div class="val"><span>20K</span><span id="loanVal">1000000</span><span>50L</span></div>

            <label>Interest Rate (%)</label>
            <input type="range" id="rate" min="1" max="15" value="9" step="0.1">
            <div class="val"><span>0.1%</span><span id="rateVal">9</span><span>15%</span></div>

            <label>Loan Term (Years)</label>
            <input type="range" id="years" min="1" max="30" value="5">
            <div class="val"><span>0.5Y</span><span id="yearsVal">5</span><span>30Y</span></div>

           

            <div class="results">
                <p>Monthly EMI: <b id="emi">₹0</b></p>
                <p>Principal: <b id="principal">₹0</b></p>
                <p>Interest Paid: <b id="interest">₹0</b></p>
                <p>Total Amount: <b id="total">₹0</b></p>
            </div>


            <div class="right">
                <canvas id="pieChart">
                    <p>piechart</p>


                </canvas>

            </div>


        </div>

        <script src="chart.js"></script>
</body>

</html>
